name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          curl -Ls "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz" | tar -xJ
          sudo install shellcheck-stable/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux tig neovim

      - name: Syntax check
        run: |
          bash -n iae
          bash -n install.sh
          bash -n lib/layout.sh
          bash -n tests/layout.sh
          bash -n tests/smoke.sh
          bash -n tests/startup.sh

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR iae install.sh lib/layout.sh tests/layout.sh tests/smoke.sh tests/startup.sh

      - name: Run tests
        run: |
          ./tests/layout.sh
          ./tests/smoke.sh
          ./tests/startup.sh
