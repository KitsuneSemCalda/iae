name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux tig neovim

      - name: Syntax check
        run: |
          bash -n iae
          bash -n install.sh
          bash -n lib/layout.sh
          bash -n tests/layout.sh
          bash -n tests/smoke.sh

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR iae install.sh lib/layout.sh tests/layout.sh tests/smoke.sh

      - name: Run tests
        run: |
          ./tests/layout.sh
          ./tests/smoke.sh
